{% extends "layout.html" %}
{% block title %}Recommendations{% endblock %}
{% block content %}
  <h1>Your top 5 nonprofits:</h1>
 
  <ul class="nonprofit-list">
    {% for nonprofit in nonprofits %}
      <li>
        <strong>{{ nonprofit.name }}</strong>
        <p>{{ nonprofit.reason }}</p>
        <a href="{{url_for('route')}}">See route</a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
